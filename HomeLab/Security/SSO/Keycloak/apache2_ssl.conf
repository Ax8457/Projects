<VirtualHost *:80>
    ServerName identity.homelab1.local
    Redirect permanent / https://identity.homelab1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName indentity.homelab1.local
    ProxyPreserveHost On
    ProxyPass / https://127.0.0.1:8443/
    ProxyPassReverse / https://127.0.0.1:8443/

    SSLEngine on
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLCertificateFile /home/keycloakuser/keycloak-21.0.2/identity.homelab1.local.crt
    SSLCertificateKeyFile /home/keycloakuser/keycloak-21.0.2/identity.homelab1.local.pem
    SSLCACertificateFile /home/keycloakuser/keycloak-21.0.2/rootCA.crt
    SSLVerifyClient optional
    SSLVerifyDepth 2
    SSLOptions +StdEnvVars +ExportCertData

    #allow localhost and/or clients to query services without certificate

     <Location />
        <RequireAny>
            Require ip 127.0.0.1
            Require ip <ClientIP>
            Require expr %{SSL_CLIENT_VERIFY} == "SUCCESS"
        </RequireAny>
    </Location>

    ErrorLog /var/log/apache2/keycloak-error_log
    CustomLog /var/log/apache2/keycloack-access_log common
</VirtualHost>
~                                                                                                                                                                                                           
~                          
