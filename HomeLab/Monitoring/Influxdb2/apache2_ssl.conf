<VirtualHost *:80>
    ServerName monitoring-db.homelab1.local
    Redirect permanent / https://monitoring-db.homelab1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitoring-db.homelab1.local
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8086/
    ProxyPassReverse / http://127.0.0.1:8086/
    
    SSLEngine on
    SSLCertificateFile /etc/influxdb/monitoring-db.homelab1.local.crt
    SSLCertificateKeyFile /etc/influxdb/monitoring-db.homelab1.local.pem
    SSLCACertificateFile /etc/icingaweb2/rootCA.crt
    SSLVerifyClient optional
    SSLVerifyDepth 2
    SSLOptions +StdEnvVars +ExportCertData
    
    #allow localhost to query services without certificate 
    
     <Location />
        <RequireAny>
            Require ip 127.0.0.1        
            Require expr %{SSL_CLIENT_VERIFY} == "SUCCESS"   
        </RequireAny>
    </Location>
    
    ErrorLog /var/log/apache2/influxdb-error_log
    CustomLog /var/log/apache2/influxdb-access_log common
</VirtualHost>
