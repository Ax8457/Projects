<VirtualHost *:80>
    ServerName monitoring-graph.homelab1.local
    Redirect permanent / https://monitoring-graph.homelab1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitoring-graph.homelab1.local
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    
    SSLEngine on
    SSLCertificateFile /etc/grafana/monitoring-graph.homelab1.local.crt
    SSLCertificateKeyFile /etc/grafana/monitoring-graph.homelab1.local.pem
    SSLCACertificateFile /etc/icingaweb2/rootCA.crt
    SSLVerifyClient optional
    SSLVerifyDepth 2
    SSLOptions +StdEnvVars +ExportCertData
    
    #allow localhost to query services without certificate 
    
     <Location />
        <RequireAny>
            Require ip 127.0.0.1        
            Require expr %{SSL_CLIENT_VERIFY} == "SUCCESS"   
        </RequireAny>
    </Location>
    
    ErrorLog /var/log/apache2/grafana.example.com-error_log
    CustomLog /var/log/apache2/grafana.example.com-access_log common
</VirtualHost>
