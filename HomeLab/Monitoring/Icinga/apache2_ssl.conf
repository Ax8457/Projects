<VirtualHost *:80>
    ServerName monitoring.homelab1.local
    Redirect permanent / https://monitoring.homelab1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitoring.homelab1.local

    DocumentRoot /usr/share/icingaweb2/public

    SSLEngine on
    SSLCertificateFile /etc/icingaweb2/monitoring.homelab1.local.crt
    SSLCertificateKeyFile /etc/icingaweb2/monitoring.homelab1.local.pem
    SSLCACertificateFile /etc/icingaweb2/rootCA.crt
    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLOptions +StdEnvVars +ExportCertData


    <Directory "/usr/share/icingaweb2/public">
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted

        # Icinga Web 2
        SetEnv ICINGAWEB_CONFIGDIR "/etc/icingaweb2"
        EnableSendfile Off

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} -s [OR]
            RewriteCond %{REQUEST_FILENAME} -l [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.php [L]
        </IfModule>

        <IfModule !mod_rewrite.c>
            DirectoryIndex error_norewrite.html
            ErrorDocument 404 /error_norewrite.html
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/icingaweb2_error.log
    CustomLog ${APACHE_LOG_DIR}/icingaweb2_access.log combined
</VirtualHost>
