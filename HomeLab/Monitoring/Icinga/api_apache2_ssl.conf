<VirtualHost *:80>
    ServerName monitoring-api.homelab1.local
    Redirect permanent / https://monitoring-api.homelab1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitoring-api.homelab1.local
    ProxyPreserveHost On
    ProxyPass / https://127.0.0.1:5665/
    ProxyPassReverse / https://127.0.0.1:5665/
    
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
 
    SSLEngine on
    SSLProxyEngine on
    SSLCertificateFile /etc/icingaweb2/monitoring-api.homelab1.local.crt
    SSLCertificateKeyFile /etc/icingaweb2/monitoring-api.homelab1.local.pem
    SSLCACertificateFile /etc/icingaweb2/rootCA.crt
    SSLVerifyClient none
    
    ErrorLog /var/log/apache2/icinga2api-error_log
    CustomLog /var/log/apache2/icinga2api-access_log common
</VirtualHost>
